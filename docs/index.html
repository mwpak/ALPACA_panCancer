<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="ALPACA compares transcriptomic and proteomic abundance across cancers by subcellular location and biological pathway."
    >
    <title>ALPACA</title>

    <link rel="icon" href="static/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&amp;display=swap"
      rel="stylesheet"
    >
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css"
      integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="static/css/base.css">
    <link rel="stylesheet" href="static/css/index.css">
    <script src="https://unpkg.com/d3@7.0.0/dist/d3.min.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#alpaca">Skip to the analyzer</a>
    <nav
      id="mainNavbar"
      class="navbar navbar-dark navbar-expand-lg py-1 fixed-top"
      aria-label="Primary navigation"
    >
      <a class="navbar-brand brand-lockup" href="./" aria-current="page">
        <img
          id="alpaca-icon"
          src="static/images/favicon.png"
          width="50"
          height="50"
          alt=""
        >
        <span>ALPACA</span>
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target="#navLinks"
        aria-controls="navLinks"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navLinks">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="about/">About</a></li>
        </ul>
      </div>
    </nav>

    <main id="alpaca">
      <h1 class="sr-only">ALPACA multi-omics comparison analyzer</h1>
      <aside id="menus" aria-label="Analysis parameters"></aside>
      <section id="analysisSection" aria-label="Comparative analysis">
        <div id="diff-metrics"></div>
        <div id="analysis-diagrams">
          <div id="panelOne"></div>
          <div id="panelTwo"></div>
        </div>
      </section>
    </main>

    <div id="reactApp" aria-hidden="true"></div>
    <noscript>
      <p class="noscript-message">ALPACA requires JavaScript to load and compare the datasets.</p>
    </noscript>

    <script src="static/frontend/bundle.js"></script>
    <script
      src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-Piv4xVNRyMGpqkS2by6br4gNJ7DXjqk09RmUpJ8jgGtD7zP9yug3goQfGII0yAns"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
